[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentarmor-monitor"
version = "0.1.0"
description = "Run Summarizer as the local session monitor and send suspicious activity to Kai"
requires-python = ">=3.11,<3.14"
# The monitor talks to Kai over HTTP with the standard library. Summarizer's own package has no
# required dependencies; its embedding model comes with the "model" extra.
# Summarizer is pinned to the commit this monitor was reviewed against. Older ones do not say
# when a call's proposal was not observed, write an event's text to the hook's error log, do
# not say what marked a summary, cannot replay a session without asking the machine, and
# stop summarizing a session whose text holds a string the embedding model takes for a
# control token such as "<|image|>". The one before this does not count the lines a packet
# cuts short, quotes a command without the colon or spaces it begins with, and can neither
# embed nor show as UTF-8 a text that holds half a surrogate pair.
dependencies = [
    "summarizer @ git+https://github.com/min-mwei/Summarizer.git@08b4e40c588ebed7ec2a5bf4f392bbf9ceef95c0",
    "numpy>=2,<3",
]

[project.optional-dependencies]
model = ["summarizer[runtime] @ git+https://github.com/min-mwei/Summarizer.git@08b4e40c588ebed7ec2a5bf4f392bbf9ceef95c0"]

[project.scripts]
agentarmor-monitor = "agentarmor_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentarmor_monitor*"]
