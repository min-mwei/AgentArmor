[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentarmor-vllm"
version = "0.2.0"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy>=2,<3", "safetensors>=0.5,<1", "pydantic>=2.9,<3"]

[project.optional-dependencies]
serve = [
    "vllm==0.33.0",
    "transformers==5.17.0",
    "huggingface-hub==1.32.0",
    "jinja2>=3.1.6,<4",
]
train-transformers = [
    "torch==2.14.0",
    "transformers==5.17.0",
    "peft==0.21.2",
    "accelerate==1.15.0",
    "datasets==5.1.0",
    "huggingface-hub==1.32.0",
    "jinja2>=3.1.6,<4",
]
train-mlx = [
    "mlx==0.32.4",
    "mlx-metal==0.32.4; sys_platform == 'darwin'",
    "mlx-lm[train]==0.32.2",
    "transformers==5.17.0",
    "datasets==5.1.0",
    "huggingface-hub==1.32.0",
    "jinja2>=3.1.6,<4",
]

[project.scripts]
agentarmor = "agentarmor_vllm.cli:main"
agentarmor-vllm = "agentarmor_vllm.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentarmor_vllm*"]
