[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agentarmor"
version = "0.1.0.dev0"
description = "Kai-powered tool-call guards for coding agents"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
dependencies = [
  "fastapi>=0.115,<1",
  "huggingface-hub>=0.30,<2",
  "numpy>=2,<3",
  "pydantic-settings>=2.6,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
vllm = ["vllm==0.32.0"]
cuda = ["vllm==0.32.0"]
dev = ["httpx>=0.27,<1", "pytest>=8,<10", "ruff>=0.11,<1", "tomli>=2; python_version<'3.11'"]
model-test = ["torch>=2.6", "transformers>=5,<6"]

[project.scripts]
agentarmor = "armor.cli:main"
agentarmor-hook = "armor.hooks:main"

[tool.hatch.build.targets.wheel]
packages = ["armor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
